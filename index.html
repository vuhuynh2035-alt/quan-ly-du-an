*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--c-bg);min-height:100%;min-height:100dvh;min-height:-webkit-fill-available;overscroll-behavior-y:none}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100%;min-height:100dvh;min-height:-webkit-fill-available;
  background:var(--c-bg);background:var(--c-bg-grad);background-attachment:fixed;color:var(--c-text);overflow-x:hidden;overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:var(--c-glow)}
#view{color:var(--c-text)}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:20px}

.hdr{background:var(--chrome-hdr);
  border:1px solid var(--chrome-border);border-radius:20px;padding:22px 24px 18px;margin-bottom:20px;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--chrome-hdr-shadow);
  display:flex;align-items:center;justify-content:center}
.hdr-inner{flex:1;min-width:0;padding:8px 0 4px}
.hdr-row{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:28px;padding:0 88px;box-sizing:border-box}
.hdr-row+.hdr-row{margin-top:10px;min-height:22px}
.hdr-row-r{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:flex-end;gap:8px}
.hdr-bell-btn{position:relative;width:40px;height:40px;border:none;border-radius:12px;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;
  background:linear-gradient(145deg,rgba(251,191,36,.22),rgba(251,191,36,.08));border:1px solid rgba(251,191,36,.35);
  box-shadow:0 4px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .15s,box-shadow .15s}
.hdr-bell-btn:hover{transform:scale(1.06);box-shadow:0 6px 18px rgba(251,191,36,.25)}
.hdr-bell-icon{font-size:22px;line-height:1;pointer-events:none}
.hdr-undo-icon{width:22px;height:22px;display:block;pointer-events:none;color:#fde68a}
.hdr-remind-badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;display:none;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;font-family:monospace;color:#fff;background:linear-gradient(180deg,#f87171,#dc2626);border:2px solid #0a1628;box-shadow:0 2px 8px rgba(220,38,38,.55);line-height:1}
.hdr-title-text{font-size:16px;font-weight:700;letter-spacing:.22em;padding-left:.22em;text-transform:uppercase;text-align:center;white-space:nowrap;
  background:linear-gradient(125deg,#FFF8C0 0%,#FFD700 15%,#F5A800 30%,#FFFBE8 48%,#FFD000 62%,#F5A800 76%,#FFD700 88%,#FFF0A0 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 1px 0 #7A4E00) drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.hdr-row:nth-child(2) .hdr-title-text{transform:translateX(20px)}
.hdr-ver{font-family:monospace;font-size:11px;font-weight:500;color:var(--chrome-hdr-ver);letter-spacing:.03em;line-height:1;white-space:nowrap}
.hdr-help-btn{border:1px solid rgba(180,210,255,.28);background:rgba(255,255,255,.08);color:var(--chrome-hdr-ver);font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;cursor:pointer;line-height:1.2;white-space:nowrap;letter-spacing:.02em;transition:background .15s,border-color .15s,color .15s}
.hdr-help-btn:hover{background:rgba(255,255,255,.16);border-color:rgba(180,210,255,.5);color:#fff}
.help-overlay{position:fixed;inset:0;background:var(--c-overlay);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:120;display:flex;justify-content:flex-end;align-items:stretch}
.help-panel{width:min(420px,100vw);max-width:100%;height:100%;background:var(--c-modal);border-left:1px solid var(--c-border);box-shadow:-24px 0 64px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:0;overflow:hidden}
.help-panel-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 12px;flex-shrink:0}
.help-panel-title{font-size:17px;font-weight:700;background:linear-gradient(90deg,#fff,#a8d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.3}
.help-panel-sub{font-size:12px;color:var(--c-muted);margin-top:4px;font-weight:500;-webkit-text-fill-color:var(--c-muted)}
.help-mode-tabs{display:flex;gap:6px;padding:0 20px 12px;flex-shrink:0;border-bottom:1px solid var(--c-border4)}
.help-mode-tabs .btn{flex:1;justify-content:center}
.help-mode-tabs .btn.active{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.45);color:#7dd3fc}
.help-panel-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 28px}
.help-ctrl{padding:12px 0;border-bottom:1px solid var(--c-border4)}
.help-ctrl:last-child{border-bottom:none}
.help-ctrl-name{font-size:13px;font-weight:700;color:var(--c-accent2);margin-bottom:4px}
.help-ctrl-desc{font-size:13px;color:var(--c-muted2);line-height:1.5}
.help-proc{margin-bottom:16px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--c-border4)}
.help-proc-title{font-size:14px;font-weight:700;color:#fde68a;margin-bottom:10px}
.help-proc ol{margin:0;padding-left:18px}
.help-proc li{font-size:13px;color:var(--c-muted2);line-height:1.55;margin-bottom:8px}
.help-proc li:last-child{margin-bottom:0}
.help-empty{font-size:13px;color:var(--c-muted);line-height:1.5}
.hdr-row-r .sync-dot{width:9px;height:9px}
.hdr-row-r .sync-offline{background:rgba(255,255,255,.38);box-shadow:0 0 0 1px rgba(255,255,255,.22)}
.hdr-row-r .sync-online{box-shadow:0 0 10px rgba(74,222,128,.75)}
.hdr-org-switch{display:none;align-items:center;gap:4px;flex-wrap:wrap;max-width:160px}
.hdr-org-label{font-size:11px;font-weight:700;color:#fde68a;letter-spacing:.02em;white-space:nowrap}
.hdr-org-btn{border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.1);color:rgba(255,248,220,.85);font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;cursor:pointer;line-height:1.2}
.hdr-org-btn.on{background:linear-gradient(145deg,rgba(251,191,36,.35),rgba(251,191,36,.15));color:#fff8c0;border-color:rgba(251,191,36,.55)}
.hdr-org-btn:hover{filter:brightness(1.08)}
@media(max-width:640px){.hdr-org-switch{max-width:110px}.hdr-org-btn{padding:3px 6px;font-size:10px}}
.org-part-bar{display:none;margin:0 0 12px;padding:0}
.org-part-bar.show{display:block}
.org-part-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.org-part-card{appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;color:inherit;transition:border-color .15s,background .15s,transform .15s;min-height:0}
.org-part-card:hover{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08);transform:translateY(-1px)}
.org-part-card.on{border-color:rgba(251,191,36,.65);background:linear-gradient(145deg,rgba(251,191,36,.22),rgba(251,191,36,.08));box-shadow:0 6px 18px rgba(0,0,0,.25)}
.org-part-card:disabled,.org-part-card.is-switching{opacity:.72;cursor:wait;transform:none}
.org-part-card.is-switching:not([aria-busy="true"]){cursor:pointer}
.org-part-card-kicker{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted4);margin-bottom:2px}
.org-part-card-title{font-size:15px;font-weight:800;color:#fde68a;margin:0}
.org-part-card.on .org-part-card-title{color:#fff8c0}
.org-part-single{display:none;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);font-size:13px;color:#fde68a;font-weight:700;margin-bottom:12px}
.org-part-single.show{display:flex}
@media(max-width:480px){
  .org-part-card{padding:8px 10px}
  .org-part-card-title{font-size:13px}
}
.emp-org-pick{display:flex;flex-wrap:wrap;gap:8px}
.emp-org-opt{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid rgba(251,191,36,.28);background:rgba(251,191,36,.06);cursor:pointer;font-size:13px;min-width:140px}
.emp-org-opt.on,.emp-org-opt:has(input:checked){border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.14)}
.emp-org-opt-title{font-weight:700;color:#fde68a}
@media(max-width:640px){
  .hdr{padding:14px 12px 12px;margin-bottom:14px}
  .hdr-inner{padding:4px 0 2px}
  .hdr-row{justify-content:flex-start;padding:0 72px 0 0;min-height:26px}
  .hdr-row+.hdr-row{margin-top:6px;min-height:auto;align-items:flex-start}
  .saree-logo{font-size:30px;letter-spacing:.14em;padding-left:0}
  .hdr-title-text{font-size:11px;letter-spacing:.06em;padding-left:0;text-align:left;white-space:normal;word-break:break-word;line-height:1.3;align-self:flex-start;width:100%;max-width:100%}
  .hdr-row:nth-child(2) .hdr-title-text{transform:translateX(20px)}
  .hdr-bell-btn{width:36px;height:36px;border-radius:10px}
  .hdr-bell-icon{font-size:19px}
  .hdr-undo-icon{width:19px;height:19px}
  .hdr-ver{font-size:10px}
  .hdr-help-btn{font-size:10px;padding:3px 7px}
}
.logo{width:46px;height:46px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(145deg,#4aaeff,#1a6fd4,#0d4fa0);
  box-shadow:0 6px 20px rgba(26,111,212,.6),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;letter-spacing:-1px}
.hdr-title{font-size:18px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(90deg,#fff 0%,#a8d4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sub{font-size:12px;color:rgba(180,210,255,.65);margin-top:3px;font-family:monospace}

.datetime-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:22px;font-size:14px;font-weight:500;color:var(--c-sub);font-family:monospace;
  margin:-12px 0 16px;padding:0 4px;letter-spacing:.02em}
.datetime-left{display:flex;align-items:center;gap:14px;min-width:0}
#datetime-time,#datetime-date{white-space:nowrap;line-height:1}
.datetime-emp{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--c-accent);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(52vw,280px);flex-shrink:1;text-align:right}
.emp-portal{max-width:720px}
.emp-page-hd{margin-bottom:16px}
.emp-page-title{font-size:20px;font-weight:700;margin-bottom:6px;color:var(--c-text)}
.emp-page-desc{font-size:13px;color:var(--c-muted);line-height:1.5}
.emp-profile-card{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:16px;border-radius:16px;
  background:var(--c-surface2);border:1px solid var(--c-border3);box-shadow:0 4px 18px var(--c-shadow)}

.emp-profile-body{min-width:0;flex:1}
.emp-profile-name{font-size:18px;font-weight:700;color:var(--c-text);margin-bottom:6px;line-height:1.2}
.emp-profile-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.emp-profile-user{font-size:12px;font-family:monospace;color:var(--c-muted);font-weight:500}
.emp-work-list{display:grid;gap:12px}

.emp-work-foot{display:flex;align-items:center;gap:10px}
.emp-prog-bar{flex:1;height:8px;border-radius:999px;background:var(--c-surface4);overflow:hidden;min-width:0}

.emp-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

.emp-detail-note{font-size:14px;color:var(--c-text2);line-height:1.5}
.emp-report-form .field:last-of-type{margin-bottom:0}
.emp-acct-card{padding:16px;border-radius:14px;background:var(--c-surface2);border:1px solid var(--c-border3);margin-bottom:14px}
.emp-acct-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--c-border4)}
.emp-acct-row:last-child{border-bottom:none;padding-bottom:0}

.att-btn-3d {
  position: relative;
  width: 100%;
  max-width: 260px;
  height: 56px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-family: inherit;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .05em;
  text-transform: uppercase;
  transition: transform .1s ease, box-shadow .1s ease;
  user-select: none;
}
.att-btn-3d::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
  border-radius: 16px 16px 40% 40%;
  pointer-events: none;
}
.att-btn-3d:active {
  transform: translateY(3px);
}
.att-btn-in-3d {
  background: linear-gradient(180deg, #4ade80 0%, #16a34a 60%, #15803d 100%);
  box-shadow: 0 4px 0 #14532d, 0 8px 20px rgba(22,163,74,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
}
.att-btn-in-3d:active {
  box-shadow: 0 1px 0 #14532d, 0 3px 10px rgba(22,163,74,0.3);
}
.att-btn-out-3d {
  background: linear-gradient(180deg, #fbbf24 0%, #d97706 60%, #b45309 100%);
  box-shadow: 0 4px 0 #78350f, 0 8px 20px rgba(217,119,6,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
}
.att-btn-out-3d:active {
  box-shadow: 0 1px 0 #78350f, 0 3px 10px rgba(217,119,6,0.3);
}
.att-btn-pulse-in {
  animation: attBtnPulseIn 2.2s ease-in-out infinite;
}
@keyframes attBtnPulseIn {
  0%, 100% {
    box-shadow: 0 4px 0 #14532d, 0 8px 20px rgba(22,163,74,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  50% {
    box-shadow: 0 4px 0 #14532d, 0 12px 28px rgba(74,222,128,0.65), 0 0 0 6px rgba(74,222,128,0.18), inset 0 1px 0 rgba(255,255,255,0.45);
  }
}
.att-btn-pulse-out {
  animation: attBtnPulseOut 2.2s ease-in-out infinite;
}
@keyframes attBtnPulseOut {
  0%, 100% {
    box-shadow: 0 4px 0 #78350f, 0 8px 20px rgba(217,119,6,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  50% {
    box-shadow: 0 4px 0 #78350f, 0 12px 28px rgba(251,191,36,0.65), 0 0 0 6px rgba(251,191,36,0.18), inset 0 1px 0 rgba(255,255,255,0.45);
  }
}
