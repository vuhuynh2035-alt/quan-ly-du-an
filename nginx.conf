server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Nén Gzip tối ưu tốc độ mạng di động
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Điều hướng định tuyến SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /js/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Không cache các file định danh phiên bản và PWA
    location ~* (app-version\.json|manifest\.json|firebase-messaging-sw\.js|firebase-config\.js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache tài nguyên tĩnh đã băm (assets có hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache ảnh, âm thanh, icon tĩnh
    location ~* \.(ogg|mp3|wav|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
