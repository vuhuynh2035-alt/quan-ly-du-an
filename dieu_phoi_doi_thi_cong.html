<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý dự án</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;
  background:linear-gradient(135deg,#060d1f 0%,#0a1628 30%,#0d1f3c 60%,#081529 100%);
  background-attachment:fixed;color:#e8f0fe;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 600px 500px at 15% 10%,rgba(56,132,255,.18) 0%,transparent 65%),
    radial-gradient(ellipse 700px 600px at 85% 5%,rgba(100,180,255,.12) 0%,transparent 65%),
    radial-gradient(ellipse 500px 400px at 80% 90%,rgba(56,100,200,.14) 0%,transparent 60%),
    radial-gradient(ellipse 400px 350px at 5% 80%,rgba(30,80,180,.10) 0%,transparent 60%)}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:20px}

.hdr{background:linear-gradient(135deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.04) 100%);
  border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:22px 24px 18px;margin-bottom:20px;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center}
.logo{width:46px;height:46px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(145deg,#4aaeff,#1a6fd4,#0d4fa0);
  box-shadow:0 6px 20px rgba(26,111,212,.6),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;letter-spacing:-1px}
.hdr-title{font-size:18px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(90deg,#fff 0%,#a8d4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sub{font-size:12px;color:rgba(180,210,255,.65);margin-top:3px;font-family:monospace}

.datetime-bar{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500;color:rgba(180,210,255,.75);font-family:monospace;
  margin:-12px 0 16px;padding:0 4px;letter-spacing:.02em}
.tabs{display:flex;gap:4px;padding:6px;margin-bottom:20px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  overflow-x:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 4px 16px rgba(0,0,0,.3)}
.tab{border:none;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
  padding:9px 14px;white-space:nowrap;color:rgba(180,210,255,.7);border-radius:11px;
  transition:all .2s ease;letter-spacing:.01em}
.tab:hover{color:#a8d4ff;background:rgba(255,255,255,.08)}
.tab.active{color:#fff;background:linear-gradient(135deg,rgba(74,174,255,.35),rgba(26,111,212,.45));
  box-shadow:0 2px 12px rgba(26,111,212,.4),inset 0 1px 0 rgba(255,255,255,.25);border:1px solid rgba(74,174,255,.4)}

.card{background:linear-gradient(145deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.04) 100%);
  border:1px solid rgba(255,255,255,.15);border-radius:18px;
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04);
  transition:transform .25s cubic-bezier(.22,.68,0,1.2),box-shadow .25s ease,border-color .25s ease;
  position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:-40%;top:-40%;width:80%;height:80%;
  background:radial-gradient(ellipse,rgba(255,255,255,.06) 0%,transparent 70%);pointer-events:none}
.card:hover{transform:translateY(-4px);
  box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 0 1px rgba(74,174,255,.3),inset 0 1px 0 rgba(255,255,255,.28);
  border-color:rgba(74,174,255,.4)}
.card-p{padding:20px}

.stat-card{background:linear-gradient(145deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.04) 100%);
  border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:18px 20px;flex:1;min-width:120px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 6px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.stat-n{font-size:34px;font-weight:800;font-family:'Inter',sans-serif;letter-spacing:-.03em;line-height:1}
.stat-l{font-size:12px;font-weight:500;color:rgba(180,210,255,.6);margin-top:6px;text-transform:uppercase;letter-spacing:.06em}

.btn{position:relative;overflow:hidden;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.01em;border-radius:12px;border:none;
  transition:transform .17s cubic-bezier(.22,.68,0,1.2),box-shadow .17s ease,filter .17s ease}
.btn::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 100%);border-radius:12px 12px 40% 40%;pointer-events:none}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(1px)}
.btn-primary{font-size:14px;padding:10px 20px;color:#fff;
  background:linear-gradient(180deg,#4aaeff 0%,#1a6fd4 50%,#155bbf 100%);
  box-shadow:0 4px 0 #0c3d8a,0 8px 20px rgba(26,111,212,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-primary:hover{filter:brightness(1.12);box-shadow:0 7px 0 #0c3d8a,0 16px 30px rgba(26,111,212,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-primary:active{box-shadow:0 1px 0 #0c3d8a,0 4px 12px rgba(26,111,212,.45)}
.btn-accent{font-size:14px;padding:10px 20px;color:#fff;
  background:linear-gradient(180deg,#38c9ff 0%,#0ca8e8 50%,#0791c9 100%);
  box-shadow:0 4px 0 #066e99,0 8px 20px rgba(12,168,232,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-accent:hover{filter:brightness(1.1);box-shadow:0 7px 0 #066e99,0 16px 30px rgba(12,168,232,.55),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-accent:active{box-shadow:0 1px 0 #066e99,0 4px 12px rgba(12,168,232,.4)}
.btn-ghost{font-size:14px;padding:10px 20px;color:#a8d4ff;
  background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.06) 100%);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 3px 0 rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-ghost:hover{color:#d6eaff;border-color:rgba(74,174,255,.5);
  box-shadow:0 6px 0 rgba(0,0,0,.25),0 14px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.28)}
.btn-ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.2)}
.btn-danger{font-size:14px;padding:10px 20px;color:#ffb3ae;
  background:linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,60,50,.12) 100%);
  border:1px solid rgba(255,120,100,.3);
  box-shadow:0 3px 0 rgba(120,20,10,.3),0 6px 16px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-danger:hover{color:#ffd0cc;border-color:rgba(255,120,100,.5);
  box-shadow:0 6px 0 rgba(120,20,10,.3),0 14px 24px rgba(150,20,10,.2),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-sm{font-size:12px!important;padding:6px 13px!important;border-radius:9px!important}
.btn:disabled{opacity:.4;transform:none!important;filter:none!important;cursor:default}

.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.03em;border:1px solid}

.field{display:block;margin-bottom:14px}
.lab{font-size:11px;font-weight:600;color:rgba(160,195,255,.65);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;display:block}
input,select,textarea{width:100%;padding:10px 13px;font-size:14px;font-family:'Inter',sans-serif;color:#e8f0fe;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:11px;outline:none;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.2);transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:rgba(74,174,255,.7);background:rgba(255,255,255,.11);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.2),0 0 0 3px rgba(74,174,255,.2)}
select option{background:#0d1f3c;color:#e8f0fe}
textarea{min-height:60px;resize:vertical}
.hint{font-size:11px;color:rgba(160,195,255,.5);margin-top:-10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.overlay{position:fixed;inset:0;background:rgba(0,0,30,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100}
.modal{background:linear-gradient(145deg,rgba(12,28,58,.95),rgba(8,20,44,.96));
  border:1px solid rgba(255,255,255,.18);border-radius:22px;width:100%;max-width:560px;padding:28px;
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  box-shadow:0 40px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.2)}

.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);margin:16px 0}
.star{cursor:pointer;font-size:20px;color:rgba(255,255,255,.2);transition:color .15s,transform .12s}
.star.on{color:#fbbf24}
.star:hover{transform:scale(1.2)}
.eq{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;
  background:rgba(255,255,255,.08);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.li{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.li:last-child{border-bottom:none}
.spec-grp{border-bottom:1px solid rgba(255,255,255,.07)}
.spec-grp:last-child{border-bottom:none}
.spec-hd{padding:10px 0;cursor:pointer;user-select:none;transition:background .15s}
.spec-hd:hover{background:rgba(255,255,255,.04);margin:0 -12px;padding:10px 12px;border-radius:8px}
.spec-arr{display:inline-block;font-size:11px;color:rgba(180,210,255,.5);transition:transform .2s;width:12px;flex-shrink:0}
.spec-arr.open{transform:rotate(90deg)}
.spec-list{padding:2px 0 10px 30px}
.spec-item{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.spec-item:last-child{border-bottom:none}
.busy-bar{display:flex;width:72px;height:7px;border-radius:999px;overflow:hidden;flex-shrink:0;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 8px rgba(34,197,94,.3)}
.busy-bar.busy-bar-lg{width:100%;height:9px;margin-top:4px}
.busy-green{background:#22c55e;height:100%}
.busy-red{background:#ef4444;height:100%;box-shadow:inset 0 0 4px rgba(255,100,100,.4)}
.busy-pct{font-family:monospace;font-size:11px;color:rgba(200,225,255,.75);flex-shrink:0;min-width:30px;text-align:right}
.gantt-card{padding:20px 16px 16px;overflow:visible}
.gantt-root{position:relative}
.gantt-sticky{position:sticky;top:0;z-index:25;background:linear-gradient(180deg,rgba(13,31,60,.98) 82%,rgba(13,31,60,0));padding:4px 0 8px;margin:0 -8px 0 0;overflow:visible}
.gantt-row-flex{display:flex;align-items:stretch}
.gantt-lbl-col{width:150px;flex-shrink:0;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px 0 0;display:flex;align-items:flex-start}
.gantt-scroll{overflow-x:auto;overflow-y:hidden;flex:1;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain;scrollbar-width:none;-ms-overflow-style:none}
.gantt-scroll::-webkit-scrollbar{display:none}
.gantt-ruler{position:relative;height:38px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.18)}
.gantt-week{position:absolute;top:0;bottom:0;padding:6px 0 0 7px;font-size:12px;font-family:monospace;color:#fff;font-weight:600;box-sizing:border-box;white-space:nowrap}
.gantt-needle{position:absolute;top:0;bottom:0;width:0;z-index:15;pointer-events:none}
.gantt-needle-line{position:absolute;top:0;bottom:0;left:0;width:2px;margin-left:-1px;background:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.85)}
.gantt-date-tip{position:absolute;top:34px;left:0;z-index:50;background:#0a1628;border:2px solid #fbbf24;color:#fff;font-size:12px;font-family:monospace;font-weight:700;padding:5px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;transform:translateX(-50%);box-shadow:0 4px 16px rgba(0,0,0,.55)}
.gantt-body-row{display:flex;align-items:center;min-height:40px;border-bottom:1px solid rgba(255,255,255,.06)}
.gantt-body-row:last-child{border-bottom:none}
.gantt-lbl{width:150px;flex-shrink:0;padding:6px 10px 6px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.gantt-lbl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e8f0fe;font-size:13px;font-weight:600}
.gantt-name{cursor:pointer;color:#c4d9f8;transition:color .15s}
.gantt-name:hover{color:#fff;text-decoration:underline}
.gantt-lbl span:last-child{font-size:11px;color:rgba(255,255,255,.65);font-family:monospace}
.gantt-track-px{position:relative;height:36px;flex-shrink:0}
.gantt-bar-wrap{position:absolute;top:50%;transform:translateY(-50%);height:20px}
.gantt-bar-bg{position:absolute;inset:0;border-radius:999px;border:1px solid}
.gantt-bar{position:absolute;left:0;top:0;height:100%;border-radius:999px;min-width:3px;z-index:1}
.gantt-bar-label{position:absolute;inset:0;display:flex;align-items:center;padding:0 32px 0 7px;font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:5;pointer-events:none}
.gantt-pct{position:absolute;top:50%;right:4px;transform:translateY(-50%);padding:0 4px;font-size:9px;font-family:monospace;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);z-index:6;pointer-events:none}
.spec-name{cursor:pointer;color:#c4d9f8;transition:color .15s}
.spec-name:hover{color:#fff;text-decoration:underline}
.swipe-wrap{position:relative;overflow:hidden;border-radius:10px;margin:-4px -6px 8px}
.swipe-actions{position:absolute;top:0;right:0;bottom:0;width:72px;display:flex;align-items:stretch;z-index:0;pointer-events:none}
.swipe-wrap.open .swipe-actions,.swipe-wrap.dragging .swipe-actions{pointer-events:auto}
.swipe-btn{border:none;border-radius:0;background:#dc2626;color:#fff;padding:0 16px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.swipe-btn:active{background:#b91c1c}
.swipe-front{position:relative;z-index:1;width:100%;padding:4px 6px;transition:transform .22s ease;background:#121c30;border-radius:8px;touch-action:pan-y;cursor:grab;user-select:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.swipe-front::after{content:"";position:absolute;top:0;right:-6px;bottom:0;width:10px;background:#121c30}
.swipe-front:active{cursor:grabbing}
.swipe-wrap.open .swipe-front{transform:translateX(-72px)}
.gdot{width:10px;height:10px;border-radius:3px;flex-shrink:0;box-shadow:0 0 8px currentColor}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-foot{display:flex;align-items:center;margin-top:12px;gap:8px}
.modal-foot-l,.modal-foot-c,.modal-foot-r{flex:1;display:flex;align-items:center;min-width:0}
.modal-foot-l{justify-content:flex-start}
.modal-foot-c{justify-content:center}
.modal-foot-r{justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x-btn{border:none;background:none;color:rgba(180,210,255,.6);font-size:24px;cursor:pointer;line-height:1;transition:color .15s;padding:0}
.x-btn:hover{color:#ff7f7f}
.fnav{
  position:fixed;top:50%;transform:translateY(-50%);
  width:24px;min-height:96px;padding:14px 4px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;
  background:linear-gradient(165deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 45%,rgba(120,170,255,.04) 100%);
  border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  box-shadow:0 4px 20px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.04);
  color:rgba(210,225,255,.82);
  font-family:'Inter',sans-serif;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .32s ease,visibility .32s ease,background .22s,box-shadow .22s,border-color .22s,color .18s,transform .18s,backdrop-filter .22s;
  z-index:40;
  overflow:hidden;
}
.fnav::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 42%,rgba(0,0,0,.06) 100%);
  opacity:.55;
}
.fnav-label{position:relative;z-index:1}
.fnav.visible{opacity:1;visibility:visible;pointer-events:auto;animation:fnavIn .38s ease}
@keyframes fnavIn{from{opacity:0}to{opacity:1}}
.fnav-l{left:0;border-radius:0 10px 10px 0;border-left:none}
.fnav-r{right:0;border-radius:10px 0 0 10px;border-right:none}
.fnav.visible:hover{
  background:linear-gradient(165deg,rgba(255,255,255,.10) 0%,rgba(74,174,255,.08) 50%,rgba(26,111,212,.06) 100%);
  border-color:rgba(120,190,255,.22);
  backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);
  color:#fff;
  box-shadow:0 8px 28px rgba(0,0,0,.28),0 0 0 1px rgba(74,174,255,.18),inset 0 1px 0 rgba(255,255,255,.20);
  transform:translateY(-50%) scaleX(1.06);
}
.fnav.visible:active{transform:translateY(-50%) scaleX(.96)}
.fnav-label{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;line-height:1.15;white-space:nowrap;display:block;writing-mode:vertical-rl;text-orientation:mixed;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.fnav.visible:hover .fnav-label{opacity:1}
@media(max-width:680px){.grid2{grid-template-columns:1fr}#app{padding:12px}.fnav{width:24px;min-height:84px;padding:12px 3px}.fnav-label{font-size:8px}}
input[type=range]{padding:0}
.saree-logo{
  font-family:'Inter',sans-serif;font-size:36px;font-weight:900;letter-spacing:.22em;padding-left:.22em;
  text-transform:uppercase;line-height:1;display:inline-block;
  background-image:url('assets/saree-gold.png');
  background-size:320% auto;background-position:center 50%;background-repeat:no-repeat;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:
    drop-shadow(0 1px 0 #735110)
    drop-shadow(0 2px 0 #5E4000)
    drop-shadow(0 4px 0 #3D2400)
    drop-shadow(0 6px 20px rgba(0,0,0,.65))
    drop-shadow(0 0 28px rgba(212,175,55,.25));
}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div style="flex:1;text-align:center;padding:8px 0 4px">
      <div class="saree-logo">SAREE</div>
      <div style="
        font-size:16px;
        font-weight:700;
        letter-spacing:.32em;
        padding-left:.32em;
        text-transform:uppercase;
        margin-top:10px;
        background:linear-gradient(125deg,
          #FFF8C0 0%,
          #FFD700 15%,
          #F5A800 30%,
          #FFFBE8 48%,
          #FFD000 62%,
          #F5A800 76%,
          #FFD700 88%,
          #FFF0A0 100%);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        background-clip:text;
        filter:
          drop-shadow(0 1px 0 #7A4E00)
          drop-shadow(0 2px 5px rgba(0,0,0,.5));
      ">QUẢN LÝ DỰ ÁN</div>

function dParse(s){if(!s)return null;var d=new Date((s.length>10?s:s+"T00:00:00"));return isNaN(d.getTime())?null:d}
function dAdd(s,days){var d=dParse(s)||new Date();d.setDate(d.getDate()+days);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function dFmt(s){var d=dParse(s);return d?pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear():s||"—"}
function dFmtG(s){var d=dParse(s);return d?pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(-2):s||"—"}
function ganttName(p){
  var loc=(p.province||"").replace(/^TP\.\s*/,"");

  var loc=(p.province||"").replace(/^TP\.\s*/,"");

function projTL(p){
  var acts=S.asgn.filter(function(a){return a.projId===p.id&&a.status==="active"});
  var starts=acts.map(function(a){return a.startDate}).filter(Boolean).sort();
  var start=p.startDate||starts[0]||dAdd(td(),-14);
  var end=p.deadline||dAdd(start,acts.length?50:30);
  if(end<start)end=dAdd(start,21);
  var prog=acts.length?Math.round(acts.reduce(function(s,a){return s+a.prog},0)/acts.length):(p.status==="in_progress"?30:10);
  return {start:start,end:end,prog:prog};
}
function weekStart(d){var x=new Date(d.getTime());x.setHours(0,0,0,0);var day=x.getDay(),diff=day===0?-6:1-day;x.setDate(x.getDate()+diff);return x}
function ganttHTML(){

  if(!projs.length)return'<p style="color:rgba(255,255,255,.55);font-size:14px">Chưa có dự án đang thực hiện.</p>';
  var items=projs.map(function(p){var t=projTL(p);return {p:p,s:t.start,e:t.end,prog:t.prog,col:GCOL[p.group]||"#38bdf8"}});
  var tMin=null,tMax=null;
  items.forEach(function(it){var a=dParse(it.s),b=dParse(it.e);if(a&&(!tMin||a<tMin))tMin=a;if(b&&(!tMax||b>tMax))tMax=b});
  if(!tMin||!tMax){tMin=dParse(td());tMax=dParse(dAdd(td(),30))}
  tMin=weekStart(tMin);tMin.setDate(tMin.getDate()-7);
  tMax=new Date(tMax.getTime());tMax.setDate(tMax.getDate()+14);
  var wkPx=58,weeks=[],wcur=new Date(tMin);
  while(wcur<=tMax){weeks.push(new Date(wcur));wcur.setDate(wcur.getDate()+7)}
  if(weeks.length<5){while(weeks.length<5){var w=weeks[weeks.length-1],n=new Date(w);n.setDate(n.getDate()+7);weeks.push(n)}}
  var trackW=weeks.length*wkPx;
  tMax=new Date(weeks[weeks.length-1].getTime());tMax.setDate(tMax.getDate()+6);
  var span=tMax-tMin||1;
  function px(d){var x=dParse(d);if(!x)return 0;return Math.max(0,Math.min(trackW,(x-tMin)/span*trackW))}
  var h='<div class="gantt-root" data-tmin="'+tMin.getTime()+'" data-tmax="'+tMax.getTime()+'" data-twidth="'+trackW+'">';

  weeks.forEach(function(w,i){h+='<div class="gantt-week" style="left:'+(i*wkPx)+'px;width:'+wkPx+'px">'+dFmtG(w.getFullYear()+"-"+pad2(w.getMonth()+1)+"-"+pad2(w.getDate()))+'</div>'});
  h+='</div></div></div></div>';
  items.forEach(function(it){
    var l=px(it.s),w=Math.max(4,px(it.e)-l),pw=Math.max(2,w*it.prog/100),nm=ganttName(it.p),bt=ganttBarText(it.p);

    h+='<div class="gantt-bar" style="width:'+pw+'px;background:linear-gradient(90deg,'+it.col+','+it.col+'bb)"></div>';

function initGantt(){
  document.querySelectorAll(".gantt-root").forEach(function(root){
    if(root._gOk)return;root._gOk=1;
    var tMin=+root.dataset.tmin,tMax=+root.dataset.tmax,tw=+root.dataset.twidth,span=tMax-tMin||1;
    var scrolls=root.querySelectorAll(".gantt-sync"),needle=root.querySelector(".gantt-needle"),tip=root.querySelector(".gantt-date-tip"),sticky=root.querySelector(".gantt-sticky");
    if(!scrolls.length||!needle||!tip||!sticky)return;
    var pinX=0;
    function dateAt(cx){var d=new Date(tMin+Math.max(0,Math.min(tw,cx))/tw*span);return dFmtG(d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()))}
    function refresh(){
      var sc=scrolls[0],rr=root.getBoundingClientRect(),sr=sc.getBoundingClientRect(),sb=sticky.getBoundingClientRect();
      pinX=Math.max(48,Math.min(sr.width-24,sr.width*0.32));
      needle.style.left=(sr.left-rr.left+pinX)+"px";
      tip.style.left=(sr.left-sb.left+pinX)+"px";
      tip.textContent=dateAt(sc.scrollLeft+pinX);
    }
    function syncScroll(src){scrolls.forEach(function(o){if(o!==src)o.scrollLeft=src.scrollLeft});refresh()}
    var sc=scrolls[0];
    pinX=Math.max(48,Math.min(sc.clientWidth-24,sc.clientWidth*0.32));
    var today=dParse(td()),todayX=today?(today.getTime()-tMin)/span*tw:tw*0.5;
    sc.scrollLeft=Math.max(0,Math.min(tw-sc.clientWidth,todayX-pinX));
    scrolls.forEach(function(sc){sc.addEventListener("scroll",function(){syncScroll(sc)})});
    refresh();
    window.addEventListener("resize",refresh);
  });
}
function mkAsgn(empId,projId,prog){return{id:uid(),projId:projId,empId:empId,startDate:td(),prog:prog,status:"active",quality:null,qNote:""}}
function seedDemo(){
  if(S.asgn.length)return false;
  var JOB_PLAN=[0,1,2,3,1,2,0];
  function projsFor(g){
    var list=S.proj.filter(function(p){return p.group===g&&p.status!=="done"});
    var names=["Đồng Nai","Bình Dương","Long An"];
    while(list.length<3){
      var idx=list.length,offs=[[-28,42],[-14,35],[3,50]][idx%3];
      var st=dAdd(td(),offs[0]),dl=dAdd(st,offs[1]);
      var p=mkProj("Thi công "+g+" — "+names[idx],g,names[idx],{startDate:st,deadline:dl});
      S.proj.push(p);list.push(p);
    }
    return list;
  }
  GROUPS.forEach(function(g){
    var emps=S.emp.filter(function(e){return e.group===g});
    var projs=projsFor(g);
    emps.forEach(function(e,i){
      var n=JOB_PLAN[i%JOB_PLAN.length];
      for(var j=0;j<n;j++)S.asgn.push(mkAsgn(e.id,projs[j].id,15+j*20));
    });
  });
  sv();return S.asgn.length>0;
}

function reco(proj){if(!proj)return[];var sw=(S.cfg.wP+S.cfg.wA+S.cfg.wS)||1;var wp=S.cfg.wP/sw,wa=S.cfg.wA/sw,ws=S.cfg.wS/sw,md=1800,pl=pLoc(proj);

var SWIPE_W=72;
function closeSwipes(except){document.querySelectorAll(".swipe-wrap.open").forEach(function(w){if(w!==except){w.classList.remove("open");var f=w.querySelector(".swipe-front");if(f)f.style.transform=""}})}
function initEmpSwipe(){
  document.querySelectorAll(".swipe-wrap").forEach(function(wrap){
    if(wrap._swipeOk)return;wrap._swipeOk=1;
    var front=wrap.querySelector(".swipe-front");if(!front)return;
    var startX=0,baseX=0,drag=false;
    function snap(x){if(x<-SWIPE_W/3){closeSwipes(wrap);wrap.classList.add("open");front.style.transform="translateX(-"+SWIPE_W+"px)"}else{wrap.classList.remove("open");front.style.transform=""}}
    function onStart(cx){startX=cx;baseX=wrap.classList.contains("open")?-SWIPE_W:0;drag=false;wrap._swiping=false;wrap.classList.add("dragging")}
    function onMove(cx){var dx=cx-startX+baseX;if(Math.abs(dx-baseX)>4){drag=true;wrap._swiping=true}var x=Math.max(-SWIPE_W,Math.min(0,dx));front.style.transform="translateX("+x+"px)"}
    function onEnd(){wrap.classList.remove("dragging");var m=front.style.transform.match(/-?\d+/);snap(m?parseFloat(m[0]):0);setTimeout(function(){wrap._swiping=false},80)}
    front.addEventListener("touchstart",function(e){onStart(e.touches[0].clientX)},{passive:true});
    front.addEventListener("touchmove",function(e){onMove(e.touches[0].clientX)},{passive:true});
    front.addEventListener("touchend",onEnd);
    front.addEventListener("mousedown",function(e){if(e.button!==0)return;onStart(e.clientX);function mm(ev){onMove(ev.clientX)}function mu(){document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);onEnd()}document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu)});
    front.addEventListener("click",function(e){if(wrap._swiping){e.preventDefault();e.stopPropagation()}});
  });
  if(!initEmpSwipe._doc){initEmpSwipe._doc=1;document.addEventListener("click",function(e){if(!e.target.closest(".swipe-wrap"))closeSwipes()});}
}

  pc:function(){

        if(n)nameEl.value=n;}
      // match province
      var provNames=["An Giang","Bà Rịa - Vũng Tàu","Bạc Liêu","Bắc Giang","Bắc Kạn","Bắc Ninh","Bến Tre","Bình Dương","Bình Định","Bình Phước","Bình Thuận","Cà Mau","Cần Thơ","Cao Bằng","Đà Nẵng","Đắk Lắk","Đắk Nông","Điện Biên","Đồng Nai","Đồng Tháp","Gia Lai","Hà Giang","Hà Nam","Hà Nội","Hà Tĩnh","Hải Dương","Hải Phòng","Hậu Giang","Hoà Bình","Hưng Yên","Khánh Hoà","Kiên Giang","Kon Tum","Lai Châu","Lâm Đồng","Lạng Sơn","Lào Cai","Long An","Nam Định","Nghệ An","Ninh Bình","Ninh Thuận","Phú Thọ","Phú Yên","Quảng Bình","Quảng Nam","Quảng Ngãi","Quảng Ninh","Quảng Trị","Sóc Trăng","Sơn La","Tây Ninh","Thái Bình","Thái Nguyên","Thanh Hoá","Thừa Thiên Huế","Tiền Giang","TP. Hồ Chí Minh","Trà Vinh","Tuyên Quang","Vĩnh Long","Vĩnh Phúc","Yên Bái"];
      var raw2=JSON.stringify(addr).toLowerCase();
      var matched="";
      for(var i=0;i<provNames.length;i++){var pn=provNames[i];var kw=pn.toLowerCase().replace("tp. ","").replace("thừa thiên ","").replace("bà rịa - ","");if(raw2.indexOf(kw)>=0){matched=pn;break;}}
      if(matched){var pvEl=document.getElementById("fpv");if(pvEl)pvEl.value=matched;}
      if(status)status.innerHTML='<span style="color:#4ade80">✓ Đã lấy thông tin! Kiểm tra và bổ sung tên nhà máy nếu cần.</span>';
    })
    .catch(function(){if(status)status.innerHTML='<span style="color:#f87171">Không kết nối được để lấy địa chỉ (cần internet). Toạ độ đã điền, bạn nhập địa chỉ tay.</span>';});},
  sc:function(){var f=S.form;f.name=document.getElementById("fn").value.trim();if(!f.name)return alert("Nhập tên");f.address=document.getElementById("fa").value;f.lat=parseFloat(document.getElementById("flat").value)||null;f.lng=parseFloat(document.getElementById("flng").value)||null;f.province=document.getElementById("fpv").value;f.contact=document.getElementById("fct").value;f.note=document.getElementById("fcn").value;if(f.id)S.cust=S.cust.map(function(x){return x.id===f.id?f:x});else{f.id=uid();S.cust.push(f)}sv();S.modal=null;S.form=null;render()},
  dc:function(id){if(confirm("Xoá khách hàng?")){S.cust=S.cust.filter(function(x){return x.id!==id});sv();S.modal=null;S.form=null;render()}},
  op:function(id){S.form=id?JSON.parse(JSON.stringify(pById(id))):{name:"",custId:"",province:DP,type:"new",group:"Điện",priority:"normal",startDate:"",deadline:"",status:"open",note:""};S.modal=projM(S.form);render()},
  ppc:function(id){var c=cById(id);if(c&&c.province){var el=document.getElementById("fp");if(el)el.value=c.province}},
  spr:function(){var f=S.form;f.name=document.getElementById("fn").value.trim();if(!f.name)return alert("Nhập tên dự án");f.custId=document.getElementById("fcu").value;f.province=document.getElementById("fp").value;f.type=document.getElementById("ft").value;f.group=document.getElementById("fg").value;f.priority=document.getElementById("fpr").value;f.startDate=document.getElementById("fsd").value;f.deadline=document.getElementById("fdl").value;f.status=document.getElementById("fst2").value;f.note=document.getElementById("fno").value;if(f.id)S.proj=S.proj.map(function(x){return x.id===f.id?f:x});else{f.id=uid();S.proj.push(f)}sv();S.modal=null;S.form=null;render()},
  dp:function(id){if(confirm("Xoá dự án?")){S.proj=S.proj.filter(function(x){return x.id!==id});if(S.selProjDet===id)S.selProjDet="";sv();S.modal=null;S.form=null;render()}},
  asgn:function(eid){S.asgn.push({id:uid(),projId:S.selProj,empId:eid,startDate:td(),prog:0,status:"active",quality:null,qNote:""});sv();render()},
  pl:function(id,v){var el=document.getElementById("pg_"+id);if(el)el.textContent=v+"%"},
  ps2a:function(id,v){S.asgn=S.asgn.map(function(a){return a.id===id?Object.assign({},a,{prog:Number(v)}):a});sv();render()},
  fin:function(id){S.asgn=S.asgn.map(function(a){return a.id===id?Object.assign({},a,{status:"done",prog:100}):a});sv();render()},
  rt:function(id,q){S.asgn=S.asgn.map(function(a){return a.id===id?Object.assign({},a,{quality:q}):a});sv();render()},
  qn:function(id,t){S.asgn=S.asgn.map(function(a){return a.id===id?Object.assign({},a,{qNote:t}):a});sv()},
  wl:function(k,v){S.cfg[k]=Number(v);var sw=(S.cfg.wP+S.cfg.wA+S.cfg.wS)||1;["wP","wA","wS"].forEach(function(kk){var el=document.getElementById("w_"+kk);if(el)el.textContent=Math.round(S.cfg[kk]/sw*100)+"%"})},
  ww:function(k,v){S.cfg[k]=Number(v);sv()},
  ns:function(k,v){S.cfg[k]=Number(v);sv()},
  ss:function(k,v){S.cfg[k]=v;sv();render()},
  exp:function(){var blob=new Blob([JSON.stringify({emp:S.emp,cust:S.cust,proj:S.proj,asgn:S.asgn,cfg:S.cfg},null,2)],{type:"application/json"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="doi_thi_cong.json";a.click()},
  demo:function(){if(S.asgn.length){if(!confirm("Xoá công việc hiện tại và tạo lại dữ liệu test bận rộn?"))return;S.asgn=[]}seedDemo();render()},
  rst:function(){if(confirm("Xoá toàn bộ và khôi phục mẫu?")){S.emp=seedE();S.cust=[];S.proj=[];S.asgn=[];S.cfg=Object.assign({},DS);seedDemo();sv();render()}}
};

/* ---- auto daily backup ---- */
function doBackup(label){
  var blob=new Blob([JSON.stringify({emp:S.emp,cust:S.cust,proj:S.proj,asgn:S.asgn,cfg:S.cfg},null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");
  a.href=url;a.download="backup_"+label+".json";a.click();URL.revokeObjectURL(url);
  ps2("cv3_lastbk",label+" (tự động)");
  var log=load("cv3_bklog",[]);log.push(label+" (tự động)");if(log.length>30)log=log.slice(-30);
  ps2("cv3_bklog",log);}
function checkAutoBackup(){
  var last=load("cv3_lastbk","");
  var todayStr=td();
  var lastDay=last?last.slice(0,10):"";
  if(lastDay!==todayStr){setTimeout(function(){doBackup(todayStr);},1200);}}
checkAutoBackup();
seedDemo();
render();
setInterval(updateDateTime,1000);
})();
